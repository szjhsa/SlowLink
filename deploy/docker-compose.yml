name: slowlink
services:
  redis:
    image: redis:7-alpine
    container_name: slowlink_redis
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: slowlink_app
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    ports:
      - "${SLOWLINK_BIND_HOST:-0.0.0.0}:${SLOWLINK_WEB_PORT:-8080}:8080"
    volumes:
      - ../data/sessions:/app/sessions
      - ../data/plugins:/app/plugins/user
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8080
      - SESSION_PATH=/app/sessions/slowlink

  caddy:
    image: caddy:2.10.2-alpine
    container_name: slowlink_caddy
    profiles: ["https"]
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      SLOWLINK_DOMAIN: "${SLOWLINK_DOMAIN:-}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../deploy/ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  redis_data:
  caddy_data:
  caddy_config:
